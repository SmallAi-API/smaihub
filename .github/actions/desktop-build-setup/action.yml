name: Desktop Build Setup
description: Setup Node.js, pnpm and install dependencies for desktop build

inputs:
  node-version:
    description: Node.js version
    required: true
  cloud-repository:
    description: >-
      Overlay repository (owner/name) for commercial desktop builds — pass the OVERLAY_REPOSITORY repository variable; deliberately no hardcoded default.
    required: false
    default: SmallAi-API/smaihub
  cloud-ref:
    description: Optional Cloud repository ref
    required: false
    default: ''
  cloud-token:
    description: GitHub token with permission to read the Cloud repository
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        node-version: ${{ inputs.node-version }}

    - name: Overlay Cloud repository for desktop build
      # Both must be present. Callers pass `${{ vars.OVERLAY_REPOSITORY }}`, which is an empty
      # string when the variable is unset — an explicitly-passed empty input does NOT fall back
      # to this action's `default`, so check it here rather than relying on that default.
      if: inputs.cloud-token != '' && inputs.cloud-repository != ''
      shell: bash
      env:
        CLOUD_CHECKOUT: ${{ runner.temp }}/lobehub-cloud
        CLOUD_REF: ${{ inputs.cloud-ref }}
        CLOUD_REPOSITORY: ${{ inputs.cloud-repository }}
        CLOUD_ROOT: ${{ github.workspace }}/..
        CLOUD_TOKEN: ${{ inputs.cloud-token }}
      run: |
        set -euo pipefail
        # Fail loudly rather than silently shipping an OSS-only commercial build.
        : "${CLOUD_REPOSITORY:?cloud-repository input is empty — pass the OVERLAY_REPOSITORY repository variable}"

        cloud_root="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
        cloud_checkout="$RUNNER_TEMP/lobehub-cloud"

        if [ "$CLOUD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
          echo "::notice::Cloud repository $CLOUD_REPOSITORY is the main repository; skipping Cloud overlay"
          exit 0
        fi

        rm -rf "$cloud_checkout"

        git clone --depth 1 --no-checkout "https://x-access-token:${CLOUD_TOKEN}@github.com/${CLOUD_REPOSITORY}.git" "$cloud_checkout"
        if [ -n "$CLOUD_REF" ]; then
          git -C "$cloud_checkout" fetch --depth 1 origin "$CLOUD_REF"
          git -C "$cloud_checkout" checkout --detach FETCH_HEAD
        else
          git -C "$cloud_checkout" checkout --detach
        fi

        resolved_cloud_ref="$(git -C "$cloud_checkout" rev-parse HEAD)"
        echo "CLOUD_REF=$resolved_cloud_ref" >> "$GITHUB_ENV"

        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');

        const source = process.env.CLOUD_CHECKOUT;
        const target = process.env.CLOUD_ROOT;
        const skip = new Set(['.git', 'lobehub', 'node_modules']);

        const copy = (from, to) => {
          const stat = fs.lstatSync(from);
          if (stat.isSymbolicLink()) {
            const link = fs.readlinkSync(from);
            fs.rmSync(to, { force: true, recursive: true });
            fs.symlinkSync(link, to);
            return;
          }

          if (stat.isDirectory()) {
            fs.mkdirSync(to, { recursive: true });
            for (const entry of fs.readdirSync(from)) {
              if (skip.has(entry)) continue;
              copy(path.join(from, entry), path.join(to, entry));
            }
            return;
          }

          fs.mkdirSync(path.dirname(to), { recursive: true });
          fs.copyFileSync(from, to);
        };

        for (const entry of fs.readdirSync(source)) {
          if (skip.has(entry)) continue;
          copy(path.join(source, entry), path.join(target, entry));
        }
        NODE

        echo "CLOUD_DESKTOP=1" >> "$GITHUB_ENV"
        echo "✅ Cloud repository $resolved_cloud_ref overlaid at $cloud_root"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        if [ "${CLOUD_DESKTOP:-}" = "1" ]; then
          cd ..
        fi
        pnpm install --node-linker=hoisted

    # 移除国内 electron 镜像配置，GitHub Actions 使用官方源更快
    - name: Remove China electron mirror from .npmrc
      shell: bash
      run: |
        NPMRC_FILE="./apps/desktop/.npmrc"
        if [ -f "$NPMRC_FILE" ]; then
          sed -i.bak '/^electron_mirror=/d; /^electron_builder_binaries_mirror=/d' "$NPMRC_FILE"
          rm -f "${NPMRC_FILE}.bak"
          echo "✅ Removed electron mirror config from .npmrc"
        fi

    - name: Install deps on Desktop
      shell: bash
      run: |
        set -euo pipefail
        workspace_root="$GITHUB_WORKSPACE"
        if [ "${CLOUD_DESKTOP:-}" = "1" ]; then
          workspace_root="$GITHUB_WORKSPACE/.."
          desktop_root="$workspace_root/lobehub/apps/desktop"
        else
          desktop_root="$GITHUB_WORKSPACE/apps/desktop"
        fi

        if [ ! -f "$desktop_root/package.json" ]; then
          echo "::error::Desktop package.json not found at $desktop_root/package.json"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "CLOUD_DESKTOP=${CLOUD_DESKTOP:-0}"
          exit 1
        fi

        echo "Installing Desktop dependencies from $desktop_root"
        echo "DESKTOP_BUILD_ROOT=$desktop_root" >> "$GITHUB_ENV"
        # The root hoisted install creates workspace-package dependency links into the
        # repository root (for example packages/utils/node_modules/es-toolkit). Desktop's
        # mainHash must resolve every bundled dependency from its own locked installation,
        # so remove those stale workspace links before rebuilding the Desktop workspace.
        for packages_root in \
          "$workspace_root/packages" \
          "$GITHUB_WORKSPACE/packages"; do
          if [ -d "$packages_root" ]; then
            find "$packages_root" -type d -name node_modules -prune -exec rm -rf {} +
          fi
        done
        for workspace_package in \
          "$workspace_root/apps/cli" \
          "$GITHUB_WORKSPACE/apps/cli" \
          "$desktop_root/stubs/business-const"; do
          if [ -d "$workspace_package" ]; then
            rm -rf "$workspace_package/node_modules"
          fi
        done
        cd "$desktop_root"
        pnpm install --frozen-lockfile
        DESKTOP_BUILD_ROOT="$desktop_root" node <<'NODE'
        const path = require('node:path');
        const { createRequire } = require('node:module');

        const desktopRoot = path.resolve(process.env.DESKTOP_BUILD_ROOT);
        const desktopRequire = createRequire(path.join(desktopRoot, 'package.json'));
        const utilsRequire = createRequire(
          path.join(desktopRoot, 'node_modules/@lobechat/utils/package.json'),
        );
        const lockedRoot = path.join(desktopRoot, 'node_modules');
        const isInsideLockedRoot = (file) => {
          const relative = path.relative(lockedRoot, path.resolve(file));
          return (
            relative === '' ||
            (!relative.startsWith(`..${path.sep}`) && !path.isAbsolute(relative))
          );
        };
        const resolutions = {
          desktop: desktopRequire.resolve('es-toolkit'),
          utils: utilsRequire.resolve('es-toolkit'),
        };

        for (const [owner, resolved] of Object.entries(resolutions)) {
          console.log(`${owner} es-toolkit: ${resolved}`);
          if (!isInsideLockedRoot(resolved)) {
            throw new Error(
              `${owner} es-toolkit resolved outside Desktop installation: ${resolved}`,
            );
          }
        }
        NODE
