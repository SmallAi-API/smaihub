name: Desktop Build Setup
description: Setup Node.js, pnpm and install dependencies for desktop build

inputs:
  node-version:
    description: Node.js version
    required: true

runs:
  using: composite
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-env
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pnpm install --node-linker=hoisted

    # 移除国内 electron 镜像配置，GitHub Actions 使用官方源更快
    - name: Remove China electron mirror from .npmrc
      shell: bash
      run: |
        NPMRC_FILE="./apps/desktop/.npmrc"
        if [ -f "$NPMRC_FILE" ]; then
          sed -i.bak '/^electron_mirror=/d; /^electron_builder_binaries_mirror=/d' "$NPMRC_FILE"
          rm -f "${NPMRC_FILE}.bak"
          echo "✅ Removed electron mirror config from .npmrc"
        fi

    - name: Install deps on Desktop
      shell: bash
      run: |
        set -euo pipefail
        workspace_root="$GITHUB_WORKSPACE"
        desktop_root="$GITHUB_WORKSPACE/apps/desktop"

        if [ ! -f "$desktop_root/package.json" ]; then
          echo "::error::Desktop package.json not found at $desktop_root/package.json"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          exit 1
        fi

        echo "Installing Desktop dependencies from $desktop_root"
        echo "DESKTOP_BUILD_ROOT=$desktop_root" >> "$GITHUB_ENV"
        # The root hoisted install creates workspace-package dependency links into the
        # repository root (for example packages/utils/node_modules/es-toolkit). Desktop's
        # mainHash must resolve every bundled dependency from its own locked installation,
        # so remove those stale workspace links before rebuilding the Desktop workspace.
        for packages_root in "$workspace_root/packages"; do
          if [ -d "$packages_root" ]; then
            find "$packages_root" -type d -name node_modules -prune -exec rm -rf {} +
          fi
        done
        for workspace_package in \
          "$workspace_root/apps/cli" \
          "$desktop_root/stubs/business-const"; do
          if [ -d "$workspace_package" ]; then
            rm -rf "$workspace_package/node_modules"
          fi
        done
        cd "$desktop_root"
        pnpm install --frozen-lockfile
        DESKTOP_BUILD_ROOT="$desktop_root" node <<'NODE'
        const path = require('node:path');
        const { createRequire } = require('node:module');

        const desktopRoot = path.resolve(process.env.DESKTOP_BUILD_ROOT);
        const desktopRequire = createRequire(path.join(desktopRoot, 'package.json'));
        const utilsRequire = createRequire(
          path.join(desktopRoot, 'node_modules/@lobechat/utils/package.json'),
        );
        const lockedRoot = path.join(desktopRoot, 'node_modules');
        const isInsideLockedRoot = (file) => {
          const relative = path.relative(lockedRoot, path.resolve(file));
          return (
            relative === '' ||
            (!relative.startsWith(`..${path.sep}`) && !path.isAbsolute(relative))
          );
        };
        const resolutions = {
          desktop: desktopRequire.resolve('es-toolkit'),
          utils: utilsRequire.resolve('es-toolkit'),
        };

        for (const [owner, resolved] of Object.entries(resolutions)) {
          console.log(`${owner} es-toolkit: ${resolved}`);
          if (!isInsideLockedRoot(resolved)) {
            throw new Error(
              `${owner} es-toolkit resolved outside Desktop installation: ${resolved}`,
            );
          }
        }
        NODE
