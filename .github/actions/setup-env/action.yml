name: Setup Environment
description: Setup Node.js, pnpm (install) and Bun (script runner) for workflows

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24.11.1'
  package-manager-cache:
    description: Pass-through to actions/setup-node package-manager-cache
    required: false
    default: 'false'
  bun-version:
    description: Bun version
    required: false
    default: 'canary'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install bun
      id: bun
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # setup-bun already retries individual requests. Retry the action as well
    # when GitHub Release downloads remain unavailable through that window.
    - name: Wait before retrying Bun download
      if: steps.bun.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Retry bun installation
      id: bun_retry
      if: steps.bun.outcome == 'failure'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Wait before final Bun download attempt
      if: steps.bun_retry.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Final bun installation attempt
      if: steps.bun_retry.outcome == 'failure'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: ${{ inputs.package-manager-cache }}
